name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vim ${{ matrix.vim }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vim: [v9.0.0000, v9.1.0]

    steps:
      - uses: actions/checkout@v7

      - name: Install Vim
        uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.vim }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev

      - name: Install make on Windows
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      - name: Show versions
        run: |
          vim --version
          make --version

      - name: Run tests
        run: make test
